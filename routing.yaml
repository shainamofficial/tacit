# Per-stage model routing for @tacit/gateway (F-CMP-3, CLAUDE.md non-negotiable #3).
# PROPOSE-ONLY: changes land via PR with the eval scorecard delta.
#
# Plan §1.3: everything routes to Claude until judge edit-rates justify
# down-tiering. Stages with fallbacks fail over on 429/5xx/connection errors
# after the SDK's own retries; judgment stages (judge, contradict, interview)
# deliberately have none so a quality-sensitive step never silently downgrades.
version: 1

defaults:
  provider: anthropic
  max_tokens: 4096
  effort: high

# USD per million tokens, Anthropic first-party rates (2026-06). Cache writes
# are 1.25x input, cache reads 0.1x input (F-CMP-5).
models:
  claude-opus-5:
    input_per_mtok: 5
    output_per_mtok: 25
    cache_write_per_mtok: 6.25
    cache_read_per_mtok: 0.5
  claude-opus-4-8: # the server-side refusal fallback may serve this model
    input_per_mtok: 5
    output_per_mtok: 25
    cache_write_per_mtok: 6.25
    cache_read_per_mtok: 0.5
  claude-sonnet-5:
    input_per_mtok: 2
    output_per_mtok: 10
    cache_write_per_mtok: 2.5
    cache_read_per_mtok: 0.2
  claude-haiku-4-5:
    input_per_mtok: 1
    output_per_mtok: 5
    cache_write_per_mtok: 1.25
    cache_read_per_mtok: 0.1

stages:
  filter:
    # Keep-or-drop classification: mid-tier per PRD §7.2; Opus only as transient-error fallback.
    model: claude-sonnet-5
    effort: low
    max_tokens: 4096
    fallbacks: [claude-opus-5]
  extract:
    # Schema-constrained extraction with verbatim quotes: mid-tier per PRD §7.2.
    model: claude-sonnet-5
    effort: low
    max_tokens: 16000
    fallbacks: [claude-opus-5]
  draft:
    # PRD §7.2 puts drafting on a mid-tier model; judge and contradict stay frontier.
    model: claude-sonnet-5
    effort: medium
    max_tokens: 12000
    fallbacks: []
  judge:
    model: claude-opus-5
    effort: high
    max_tokens: 8192
    fallbacks: []
  contradict:
    # Discovery of non-obvious conflicts and implied knowledge stays frontier (PRD §7.2 step 5).
    # Proposed high (was xhigh): ~44 discovery calls of ~2k tokens each on Opus; judge earned its
    # numbers at high, and the run cap ($15) leaves ~$4 for contradict + drift together.
    model: claude-opus-5
    effort: high
    max_tokens: 8192
    fallbacks: []
  contradict_verify:
    # Pairwise "does X contradict Y" against source excerpts runs mid-tier (PRD §7.2 step 5);
    # the fallback is an upgrade, never a downgrade.
    model: claude-sonnet-5
    effort: medium
    max_tokens: 4096
    fallbacks: [claude-opus-5]
  drift:
    # Pairwise "does the code contradict this doc statement" against code excerpts: mid-tier
    # (PRD §7.2); code is ground truth, the model only reads it. Opus fallback is an upgrade.
    model: claude-sonnet-5
    effort: high
    max_tokens: 4096
    fallbacks: [claude-opus-5]
  interview:
    model: claude-opus-5
    effort: high
    max_tokens: 2048
    fallbacks: []
  eval_judge:
    model: claude-opus-5
    effort: low
    max_tokens: 512
    fallbacks: [claude-sonnet-5]
