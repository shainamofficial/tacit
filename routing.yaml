# Per-stage model routing for @tacit/gateway (F-CMP-3, CLAUDE.md non-negotiable #3).
# PROPOSE-ONLY: changes land via PR with the eval scorecard delta.
#
# Plan §1.3: everything routes to Claude until judge edit-rates justify
# down-tiering. Stages with fallbacks fail over on 429/5xx/connection errors
# after the SDK's own retries; judgment stages (judge, contradict, interview)
# deliberately have none so a quality-sensitive step never silently downgrades.
version: 1

defaults:
  provider: anthropic
  max_tokens: 4096
  effort: high

# USD per million tokens, Anthropic first-party rates (2026-06). Cache writes
# are 1.25x input, cache reads 0.1x input (F-CMP-5).
models:
  claude-opus-5:
    input_per_mtok: 5
    output_per_mtok: 25
    cache_write_per_mtok: 6.25
    cache_read_per_mtok: 0.5
  claude-opus-4-8: # the server-side refusal fallback may serve this model
    input_per_mtok: 5
    output_per_mtok: 25
    cache_write_per_mtok: 6.25
    cache_read_per_mtok: 0.5
  claude-sonnet-5:
    input_per_mtok: 2
    output_per_mtok: 10
    cache_write_per_mtok: 2.5
    cache_read_per_mtok: 0.2
  claude-haiku-4-5:
    input_per_mtok: 1
    output_per_mtok: 5
    cache_write_per_mtok: 1.25
    cache_read_per_mtok: 0.1

stages:
  filter:
    model: claude-opus-5
    effort: low
    max_tokens: 1024
    fallbacks: [claude-sonnet-5]
  extract:
    model: claude-opus-5
    effort: low
    max_tokens: 4096
    fallbacks: [claude-sonnet-5]
  draft:
    model: claude-opus-5
    effort: medium
    max_tokens: 8192
    fallbacks: [claude-sonnet-5]
  judge:
    model: claude-opus-5
    effort: high
    max_tokens: 8192
    fallbacks: []
  contradict:
    model: claude-opus-5
    effort: xhigh
    max_tokens: 8192
    fallbacks: []
  interview:
    model: claude-opus-5
    effort: high
    max_tokens: 2048
    fallbacks: []
  eval_judge:
    model: claude-opus-5
    effort: low
    max_tokens: 512
    fallbacks: [claude-sonnet-5]
