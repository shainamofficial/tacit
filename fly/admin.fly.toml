# The admin connect flow: `fly deploy -c fly/admin.fly.toml`
app = "tacit-admin"
primary_region = "iad"

[build]
  dockerfile = "../Dockerfile"

[env]
  TACIT_PROCESS = "admin"
  PORT = "3400"
  # Must match the redirect URIs registered with Slack, Google, and GitHub.
  TACIT_PUBLIC_URL = "https://tacit-admin.fly.dev"

# Secrets (fly secrets set …): DATABASE_URL, TACIT_ORG_ID, TACIT_ADMIN_TOKEN, TACIT_MASTER_KEY,
#   SLACK_CLIENT_ID, SLACK_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET,
#   GITHUB_APP_SLUG, GITHUB_APP_ID, GITHUB_APP_PRIVATE_KEY

[http_service]
  internal_port = 3400
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
