services:
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "${TACIT_PG_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: tacit
      POSTGRES_PASSWORD: tacit
      POSTGRES_DB: tacit
    volumes:
      - tacit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tacit -d tacit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tacit-pgdata:
